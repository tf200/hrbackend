services:
    db:
        image: postgres:16-alpine
        ports:
            - "15432:5432"
        environment:
            POSTGRES_USER: maihr
            POSTGRES_PASSWORD: maihr
            POSTGRES_DB: maihr
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U maihr -d maihr"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "16379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        image: hrbackend:latest
        platform: linux/amd64
        ports:
            - "18080:8080"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
